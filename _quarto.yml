project:
  type: website
  # Where the built site should be written
  output-dir: docs
  render:
    - index.qmd
    - about.qmd
    - services.qmd
    - contact.qmd
  # Make sure our custom assets are copied into the output
  resources:
    - styles.css
    - script.js
    - assets/after.html
    - logo.png
    - site/player-st.html
    - site/player-st.js
    - site/data/player_st_comparison_features.json
    - site/team-prototype.html
    - site/team-prototype.js
    - site/data/team_comparison_features.json

website:
  title: "EliOra Tech Solutions"
  # Disable Quarto's default navigation bar so we can use our own
  navbar: false

format:
  html:
    # Use our custom stylesheet for all pages
    css: styles.css
    toc: false
    # Inject the after‑body HTML to load Three.js, Vanta.js, and our script
    include-after-body: assets/after.html
    # Render pages with a custom layout so Quarto doesn't add its own grid or header
    page-layout: custom
