project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - services.qmd
    - work.qmd
    - about.qmd
    - contact.qmd
  resources:
    - CNAME
    - robots.txt
    - sitemap.xml
    - assets/optimized/*
    - assets/favicon.png
    - assets/favicon.ico
    - assets/social-preview.png
    - site/player-st.html
    - site/player-st.js
    - site/data/player_st_comparison_features.json
    - site/executive-demo.html
    - site/team-prototype.html
    - site/team-prototype.js
    - site/data/team_comparison_features.json
    - site/data/team_points_drivers.json

website:
  title: "EliOra Tech Solutions"
  site-url: https://elioratechsolutions.com
  description: "EliOra builds reporting systems, data pipelines, dashboards, decision tools, and applied-AI workflows that make the next move clear."
  favicon: assets/favicon.png
  image: assets/social-preview.png
  open-graph: true
  twitter-card: true
  search: false
  navbar: false
  page-navigation: false

format:
  html:
    theme: none
    css: styles.css
    toc: false
    page-layout: custom
    canonical-url: true
    include-in-header: includes/site-head.html
    include-before-body: includes/site-header.html
    include-after-body: includes/site-footer.html
    html-math-method: plain
    smooth-scroll: true

language:
  title-block-published: ""
